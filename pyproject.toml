[project]
name = "miki"
version = "1.5.0"
description = "Discord bot Miki"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.11.13",
    "aiosqlite==0.21.0",
    "discord.py==2.5.2",
    "python-dotenv==1.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.0",
    "pytest-asyncio==1.0.0",
    "ruff==0.11.13",
]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
