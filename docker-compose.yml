services:
  miki-bot:
    build: .
    container_name: miki_bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MIKI_ENV: ${MIKI_ENV:-production}
      DATABASE_PATH: ${DATABASE_PATH:-/app/data/miki.db}
      PYTHONUNBUFFERED: "1"
    volumes:
      - miki-data:/app/data

volumes:
  miki-data:
